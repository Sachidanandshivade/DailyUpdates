<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tables</title>
</head>
<body>
<center>

    <table style="border: black solid 2px" border="1">
        <caption>Student Marks Sheet</caption>
        <tr>
            <th>SL.No</th>
            <th>Name</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Sachi</td>
            <td>80</td>
        </tr>
        <!--     data   -->
        <tr>
            <td>2</td>
            <td>Pari</td>
            <td>70</td>
        </tr>
        <!--        -->
        <tr>
            <td>3</td>
            <td>Gubbi</td>
            <td>85</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Arjun</td>
            <td>85</td>
        </tr>
        <tr>
            <!-- Added inline styles to the td and video to contain the rotation dimensions -->
            <td style="width: 200px; height: 320px; text-align: center; vertical-align: middle; padding: 20px;">
                <video controls src="video.mp4" style="display: block; width: 300px; height: 180px; transform: rotate(-90deg); margin: 0 auto;"></video>
                <div style="margin-top: 70px;">SpiderMan Action</div>
            </td>
        </tr>
    </table>
    <table border="1">
        <tr>
            <td colspan="4">1</td>
        </tr>
        <tr>
            <td rowspan="2">1</td>
            <td>2</td>
            <td>3</td>
            <td rowspan="2">4</td>
        </tr>
        <tr>
            <td>1</td>
            <td>2</td>
        </tr>


        <tr>
            <td colspan="4">1</td>
        </tr>
    </table>
</center>
</body>
</html>
