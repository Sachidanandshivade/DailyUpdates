<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Validation</title>
</head>
<body>
    <form>
        <!-- Not empty, Between 3-15 characters, Only letters, numbers, underscores -->
        <label>Username:</label>
        <input type="text" id="username">
        <br><br>

        <!-- letters, numbers, ., _, - before @, valid domain name after @, a dot + at least 2 letters (e.g., .com, .in) -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <!-- -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <script>
        f = document.querySelector("form");
        f.addEventListener('submit', (event)=>{
            event.preventDefault();
            let username = document.getElementById("username").value.trim();
            // regex: only letters, numbers, underscores
            let regex = /^[a-zA-Z0-9_]+$/;

            if (username === "") {
                alert("Username is required!");
            } else if (username.length < 3) {
                alert("Username must be at least 3 characters!");
            } else if (username.length > 15) {
                alert("Username must not exceed 15 characters!");
            } else if (!regex.test(username)) {
                alert("Only letters, numbers, and underscores allowed!");
            } else {
                alert("Valid Name");
            }

            let password = document.getElementById("password").value.trim();
        let passwordRegex =
          /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&^#])[A-Za-z\d@$!%*?&^#]{8}$/;


        if (password === "") {
          alert("Password is required!");
        } else if (password.includes(" ")) {
          alert("Password should not contain spaces!");
        } else if (!passwordRegex.test(password)) {
          alert("Password must be exactly 8 characters .");
        } else {
          alert("Valid Password!");
        }

        });
    </script>
</body>
</html>
