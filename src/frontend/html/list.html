<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lists in Html</title>
</head>
<body>
    <h4>Ordered List</h4>
    <ol type="a" start="24">
        <li>Idly</li>
        <li>Poha</li>
        <li>Dosa</li>
    </ol>

    <ul type="square">
        <li>Idly</li>
        <li>Poha</li>
        <li>Dosa</li>
    </ul>
<dl>
    <dt>HTML
    </dt>
    <dd>Hyper text markup language</dd>
    <dt>css</dt>
    <dd>Cascading style sheet</dd>
</dl>

</body>
</html>
