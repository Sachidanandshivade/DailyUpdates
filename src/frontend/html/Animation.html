<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animations</title>
    <script src="/JAVA_SCRIPT/hello.js"></script>

    <style>
        @keyframes slideIn{
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            100%{
                transform: translatex(0);
                opacity: 1;
            }
        }

        .first{
            width: 100px;
            height: 100px;
            border-radius: 40px;
            margin: 30px;
            align-content: center;
            animation-name: slideIn;
            animation-duration: 2s;
            animation-timing-function: ease-in;
            background: conic-gradient(red 20%,yellow 50% , Green 100%);
        }
    </style>
</head>
<body>
    <div class="first" >Welcome to CSS Animations!</div>
    <button onclick="showMessage()">Click Me!</button>
    <button onclick="hello()">Test Me</button>
    <script>
        function showMessage() {
            alert("Hello, World!")
        }
    </script>
</body>
</html>
