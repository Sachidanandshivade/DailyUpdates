<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animations</title>
    <style>
        @keyframes slideIn{
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            100%{
                transform: translatex(0);
                opacity: 1;
            }
        }

        .first{
            animation-name: slideIn;
            animation-duration: 2s;
            animation-timing-function: ease-in;
            background: conic-gradient(red 20%,yellow 50% , Green 100%);
        }
    </style>
</head>
<body>
    <div class="first" >Welcome to CSS Animations!</div>
</body>
</html>
