<html lang="en">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Media</title>
    <style>
    @media(max-width: 768px){
    body{
    background-color: lightgray;
    }

        body{

        }
        h1{

        }
    }

</head>
<body>

<p> this is a paragraph</p>
</body>
</html>
