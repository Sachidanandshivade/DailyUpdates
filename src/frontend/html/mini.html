<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>User Search</h1>
       <script>
        const searchInput = document.createElement("input");
        searchInput.placeholder = "search users";
        
        const message = document.createElement("p");
        const list = document.createElement("ul");
        
        document.body.append(searchInput);
        document.body.append(message);
        document.body.append(list);

        let users=[];
        async function getUsers() {
         message.textContent = "Loading users..."

            try{
            const response = await fetch("https://dummyjson.com/users");
            if(!response.ok){
                throw new Error("Request failed");
            }
             
            const data = await response.json();
            users = data.users;
             for(let user of users) {
                const li = document.createElement("li");
                li.textContent = `${user.firstName} - ${user.email}`;
                list.append(li);
             }
        message.textContent = `User Loaded: ${data.users.length}`;

            }catch(error) {
                message.textContent = "Failed to load users"
            }
        }
       
        
        getUsers();

    

        searchInput.addEventListener("input", ()=>{
        const filteredUsers =  users.filter(user => user.firstName.toLowerCase().includes(searchInput.value.toLowerCase()) || 
        user.lastName.toLowerCase().includes(searchInput.value.toLowerCase()) ||
        user.email.toLowerCase().includes(searchInput.value.toLowerCase()) 
        );
    
       list.innerHTML = "";
       if(filteredUsers.length === 0){
        const li = document.createElement("li");
        li.textContent = "No users found";
        list.append(li);
       }
       for (let user of filteredUsers) {
    const li = document.createElement("li");
    li.textContent = `${user.firstName} - ${user.email}`;
    list.append(li);
}
        message.textContent =
    `${filteredUsers.length} ${filteredUsers.length === 1 ? "user" : "users"} found`;
        
        })

    </script>
</body>
</html>
